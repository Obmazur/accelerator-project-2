<!DOCTYPE html>
<html class="page" lang="ru" data-validate="html">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Сайт туристического агентства Lifetour">
    <title>Lifetour</title>
    <link rel="preload" href="fonts/Montserrat-Bold.woff2" type="font/woff2" as="font">
    <link rel="preload" href="fonts/Montserrat-ExtraBold.woff2" type="font/woff2" as="font">
    <link rel="preload" href="fonts/Montserrat-Regular.woff2" type="font/woff2" as="font">
    <link rel="preload" href="fonts/Montserrat-SemiBold.woff2" type="font/woff2" as="font">
    <link rel="preload" href="fonts/Montserrat-Medium.woff2" type="font/woff2" as="font">
    <link rel="stylesheet" href="sass/style.scss">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicons/favicon.png">
  </head>

  <body class="page__body">

    <header class="header" data-test="header">
      <div class="header__container">
        <nav class="header__nav header__nav--is-closed">
          <button class="header__button button js-toggle-button" type="button">
            <span class="visually-hidden">Открыть/Закрыть меню сайта.</span>
          </button>
          <div class="header__wrapper">
            <svg class="header__logo" width="142" height="42">
              <use href="/__spritemap#sprite-logo"></use>
            </svg>
            <ul class="header__list">
              <li class="header__item">
                <a class="header__link" href="#tours">Туры</a>
              </li>
              <li class="header__item">
                <a class="header__link" href="#training">Обучение</a>
              </li>
              <li class="header__item">
                <a class="header__link" href="#about">О нас</a>
              </li>
              <li class="header__item">
                <a class="header__link" href="#reviews">Отзывы</a>
              </li>
              <li class="header__item">
                <a class="header__link" href="#gallery">Фотографии</a>
              </li>
              <li class="header__item">
                <a class="header__link" href="#contacts">Контакты</a>
              </li>
            </ul>
            <a class="header__phone" href="tel:88000000000">
              8 800 000-00-00
            </a>
          </div>
        </nav>
      </div>
    </header>

    <div class="page__overlay"></div>
    <script type="module" src="js/main.js"></script>
  </body>

</html>
